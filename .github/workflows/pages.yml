name: Deploy public clock to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - static/clock.css
      - static/clock.js
      - tests/test_clock.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check clock behavior
        run: node tests/test_clock.js
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p "$RUNNER_TEMP/webclock-pages/static"
          cp index.html "$RUNNER_TEMP/webclock-pages/"
          cp static/clock.css static/clock.js "$RUNNER_TEMP/webclock-pages/static/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/webclock-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
