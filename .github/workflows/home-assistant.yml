name: Installation tests and release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - .github/workflows/home-assistant.yml
      - custom_components/**
      - homeassistant/**
      - hacs.json
      - repository.yaml
      - scripts/**
      - tools/**
      - tests/**
      - webclock/**
      - templates/**
      - static/**
      - app.py
      - sw.js
      - setup.sh
      - install.sh
      - docker_update.sh
      - update_clock.py
      - update_clock.sh
      - index.html
      - VERSION
      - Dockerfile
      - docker-compose.yml
      - requirements.txt
      - .dockerignore
      - .env.example
  pull_request:
    paths:
      - .github/workflows/home-assistant.yml
      - custom_components/**
      - homeassistant/**
      - hacs.json
      - repository.yaml
      - scripts/**
      - tools/**
      - tests/**
      - webclock/**
      - templates/**
      - static/**
      - app.py
      - sw.js
      - setup.sh
      - install.sh
      - docker_update.sh
      - update_clock.py
      - update_clock.sh
      - index.html
      - VERSION
      - Dockerfile
      - docker-compose.yml
      - requirements.txt
      - .dockerignore
      - .env.example
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-assistant-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_NO_CACHE_DIR: '1'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  integration:
    # Use only standard public hosted runners, without retained caches/artifacts.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check package and release versions
        id: version
        run: |
          args=(--check)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          version=$(python tools/build_release.py "${args[@]}")
          test -f "doc/releases/v$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install real Home Assistant and server dependencies
        run: python -m pip install 'homeassistant==2026.9.4' -r requirements.txt
      - name: Test integration, cards and installation packages
        run: |
          python -m unittest discover -s homeassistant/tests -p 'test_*.py'
          node homeassistant/tests/test_cards.js
          python -m unittest discover -s tests -p 'test_*.py'
          for test in tests/test_*.js; do node "$test"; done
          for script in *.sh scripts/*.sh scripts/update/*.sh homeassistant/*.sh tests/rehearsal/*.sh; do bash -n "$script"; done
          git diff --check

  app:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - name: Build installable App image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: homeassistant/addon/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: webclock-test:local
          build-args: |
            BUILD_VERSION=${{ needs.integration.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
      - name: Test actual container startup, Ingress, display isolation and restart
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker network create --subnet 172.30.32.0/24 webclock-test
          docker volume create webclock-data
          docker run -d --name webclock --hostname local-webclock --network-alias local-webclock --platform "$PLATFORM" --network webclock-test --ip 172.30.32.3 -v webclock-data:/data webclock-test:local
          docker run --rm -i --platform "$PLATFORM" --network webclock-test --ip 172.30.32.2 --entrypoint python webclock-test:local - local-webclock < homeassistant/tests/check_container.py
          docker logs webclock 2>&1 | grep -F 'Home Assistant integration URL: http://local-webclock:8100'
          identity=$(docker exec webclock sha256sum /data/auth.json)
          docker restart webclock
          docker run --rm -i --platform "$PLATFORM" --network webclock-test --ip 172.30.32.2 --entrypoint python webclock-test:local - local-webclock < homeassistant/tests/check_container.py
          test "$identity" = "$(docker exec webclock sha256sum /data/auth.json)"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs webclock 2>&1 || true
          docker rm -f webclock || true
          docker volume rm webclock-data || true
          docker network rm webclock-test || true

  server:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      WEBCLOCK_VERSION: ${{ needs.integration.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - name: Install from a clean checkout using the real Docker installer
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: |
          cp .env.example .env
          echo 'WEBCLOCK_HTTP_PORT=18500' >> .env
          bash setup.sh --docker --build
          test ! -e .webclock-install.json
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' webclock)" = "$WEBCLOCK_VERSION"
      - name: Check installed service and restart
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18500/api/health > "$RUNNER_TEMP/health.json"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          health = json.loads((Path(os.environ['RUNNER_TEMP']) / 'health.json').read_text())
          assert health['status'] == 'ok' and health['deployment_mode'] == 'self', health
          assert health['version'] == os.environ['WEBCLOCK_VERSION'], health
          PYTHON
          docker compose restart
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18500/api/health
          curl --fail --silent --show-error http://127.0.0.1:18500/admin > /dev/null
      - name: Rehearse image replacement and rollback with disposable data
        run: sudo python3 tests/rehearsal/rehearse_docker_update.py --source-image "ghcr.io/kcayut/webclock:$WEBCLOCK_VERSION"
      - name: Rehearse managed HTTPS update and authorization preservation
        run: sudo python3 tests/rehearsal/rehearse_docker_update.py --source-image "ghcr.io/kcayut/webclock:$WEBCLOCK_VERSION" --managed
      - name: Rehearse the host worker and recreated control socket
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT bash tests/rehearsal/rehearse_docker_worker.sh
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose logs || true
          docker compose down || true

  systemd:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rehearse a fresh Linux installation and restart
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP bash tests/rehearsal/rehearse_install.sh

  publish:
    needs: [integration, app, server, systemd]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'kcayut/webclock' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v${{ needs.integration.outputs.version }}
      VERSION: ${{ needs.integration.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify checkout and refuse to overwrite a public release
        id: existing
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .draft')
          if [ "$draft" = false ]; then echo 'This version is already published; choose a new version.' >&2; exit 1; fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-architecture server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kcayut/webclock:${{ needs.integration.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ needs.integration.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/kcayut/webclock
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish versioned multi-architecture Home Assistant App
        uses: docker/build-push-action@v7
        with:
          context: .
          file: homeassistant/addon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kcayut/webclock-addon:${{ needs.integration.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ needs.integration.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/kcayut/webclock
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Require anonymous access to both architectures before releasing
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          for package in webclock webclock-addon; do
            if ! docker manifest inspect "ghcr.io/kcayut/$package:$VERSION" > "$RUNNER_TEMP/$package-manifest.json"; then
              echo "Make ghcr.io/kcayut/$package public in GitHub package settings, then rerun this workflow. No Release has been published." >&2
              exit 1
            fi
          done
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          for package in ('webclock', 'webclock-addon'):
              manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / (package + '-manifest.json')).read_text())
              platforms = {(item['platform']['os'], item['platform']['architecture']) for item in manifest['manifests']}
              assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, (package, platforms)
          PYTHON
      - name: Package committed files and publish the complete release
        env:
          EXISTING_DRAFT: ${{ steps.existing.outputs.draft }}
        run: |
          assets="$RUNNER_TEMP/release-assets"
          python tools/build_release.py --tag "$RELEASE_TAG" --output "$assets"
          if [ "$EXISTING_DRAFT" = true ]; then
            gh release upload "$RELEASE_TAG" "$assets"/* --clobber
            gh release edit "$RELEASE_TAG" --title "WebClock $RELEASE_TAG" --notes-file "doc/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" "$assets"/* --draft --verify-tag --title "WebClock $RELEASE_TAG" --notes-file "doc/releases/$RELEASE_TAG.md"
          fi
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
