name: WebClock
version: "0.1.0"
slug: webclock
description: Run WebClock Server inside Home Assistant
url: https://github.com/kcayut/webclock
arch:
  - aarch64
  - amd64
image: ghcr.io/kcayut/webclock-addon
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_entry: /admin
panel_title: WebClock
panel_icon: mdi:clock-digital
panel_admin: true
aliases:
  - webclock
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Optional LAN display access
watchdog: http://[HOST]:[PORT:8100]/api/health
backup: cold
stage: experimental
