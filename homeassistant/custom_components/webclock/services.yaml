get_target:
  name: Get content assignment
  description: Uses an independently authorized group or device assignment.
  fields:
    resource:
      required: true
      selector:
        select:
          options:
            - schedules
            - events
    target_kind:
      required: true
      selector:
        select:
          options:
            - group
            - device
    id:
      name: Content ID
      required: true
      selector:
        text: {}
    target_id:
      name: Target ID
      required: true
      selector:
        text: {}
assign_content:
  name: Assign content
  description: Uses an independently authorized group or device assignment.
  fields:
    resource:
      required: true
      selector:
        select:
          options:
            - schedules
            - events
    target_kind:
      required: true
      selector:
        select:
          options:
            - group
            - device
    id:
      name: Content ID
      required: true
      selector:
        text: {}
    target_id:
      name: Target ID
      required: true
      selector:
        text: {}
    assigned:
      name: Assigned
      required: true
      selector:
        boolean: {}
    revision:
      name: Assignment revision from get_target
      required: true
      selector:
        text: {}
