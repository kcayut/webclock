list_calendar_events:
  name: List external calendar events
  description: Lists events from explicitly authorized sources for calendar-linked alarms.
  fields:
    source_ids:
      name: Authorized source IDs
      required: true
      selector:
        object: {}
list_alarms:
  name: List alarms
  description: Returns saved content and revisions allowed by the program credential.
create_alarm:
  name: Create alarm
  description: Uses the separate program credential. Saving does not confirm device synchronization or playback.
  fields:
    request_id:
      name: Stable request ID (reuse when retrying)
      required: true
      selector:
        text: {}
    schedule:
      name: Alarm data
      required: true
      selector:
        object: {}
update_alarm:
  name: Update alarm
  description: Uses the separate program credential. Saving does not confirm device synchronization or playback.
  fields:
    id:
      name: Content ID
      required: true
      selector:
        text: {}
    revision:
      name: Revision from the last read
      required: true
      selector:
        text: {}
    schedule:
      name: Alarm data
      required: true
      selector:
        object: {}
delete_alarm:
  name: Delete alarm
  description: Uses the separate program credential. Saving does not confirm device synchronization or playback.
  fields:
    id:
      name: Content ID
      required: true
      selector:
        text: {}
    revision:
      name: Revision from the last read
      required: true
      selector:
        text: {}
