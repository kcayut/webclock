<!DOCTYPE html>
<html lang="{{ language }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WebClock">
    <title>{{ translations[language].app_title }}</title>
    {% include 'brand_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='clock.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='time-inputs.css') }}">
    <style>
        #alarm-bell {
            display: none; position: fixed; top: 8px; right: 8px; z-index: 140;
            width: 44px; height: 44px; padding: 9px; border: 1px solid #777;
            border-radius: 50%; background: #111; color: #e8b45a; cursor: pointer;
        }
        #alarm-bell.sound-ready { color: #fff; border-color: #bbb; }
        #alarm-flash {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 135; pointer-events: none; border: 12px solid #e00000;
            box-shadow: inset 0 0 45px 12px #c00000;
        }
        .alarm-ringing { cursor: pointer; }
        .alarm-ringing #list-container { visibility: hidden; }
        .alarm-ringing #alarm-flash {
            display: block;
            -webkit-animation: alarm-edge 2s ease-in-out infinite;
            animation: alarm-edge 2s ease-in-out infinite;
        }
        @-webkit-keyframes alarm-edge { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
        @keyframes alarm-edge { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
        .alarm-steady #alarm-flash { -webkit-animation: none; animation: none; opacity: 0.8; }
        @media (prefers-reduced-motion: reduce) {
            .alarm-ringing #alarm-flash { -webkit-animation: none; animation: none; opacity: 0.8; }
        }
        #alarm-message {
            display: none; position: fixed; left: 8%; right: 8%; bottom: 12%; z-index: 140;
            color: #fff; background: #300; border: 1px solid #ef5350; border-radius: 8px;
            padding: 16px; text-align: center; font-size: 22px; line-height: 1.5;
            word-wrap: break-word;
        }
        #alarm-prompt { font-size: 18px; color: #ffcaca; }
        #alarm-help { font-size: 12px; line-height: 1.5; }
        #alarm-manage { color: #9cc7ff; }
        #connection-panel #alarm-motion { width: auto; }
        #list-container {
            display: none;
            width: 95%;
            height: 25vh;
            flex-shrink: 0;
            margin-top: 0;
            position: relative;
            overflow: hidden;
        }

        .event-row {
            color: #ccc;
            position: absolute;
            width: 100%;
            height: 72%;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 10vh;
        }

        .event-content-wrapper {
            display: inline-block;
            white-space: nowrap;
        }

        .scrolling {
            -webkit-animation: scroll-left 10s linear infinite;
            animation: scroll-left 10s linear infinite;
            padding-left: 100%;
        }

        @-webkit-keyframes scroll-left {
            0% {
                -webkit-transform: translateX(0);
            }

            100% {
                -webkit-transform: translateX(-100%);
            }
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .event-row.active {
            opacity: 1;
            z-index: 10;
        }

        .event-time {
            color: #f39c12;
            margin-right: 20px;
            font-weight: bold;
            display: inline-block;
        }

        .force-black #clock-container,
        .force-black #list-container {
            opacity: 0 !important;
        }

        #event-counter {
            position: absolute;
            bottom: 5px;
            right: 15px;
            font-size: 5vh;
            color: #888;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 10px;
            border-radius: 12px;
            z-index: 20;
            pointer-events: none;
        }

        #connection-toggle {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 26px;
            text-align: center;
            z-index: 130;
            opacity: 0.35;
            cursor: pointer;
        }

        #connection-toggle:hover,
        #connection-toggle:focus {
            opacity: 0.9;
            outline: none;
        }

        #connection-panel {
            position: fixed;
            right: 10px;
            bottom: 46px;
            width: 340px;
            max-width: calc(100vw - 20px);
            color: #ddd;
            background: rgba(12, 12, 12, 0.94);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            line-height: 1.35;
            z-index: 125;
            display: none;
            max-height: calc(100vh - 65px);
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
        }

        #connection-panel.open {
            display: block;
        }

        #connection-panel label {
            display: block;
            margin: 8px 0 4px;
            color: #aaa;
        }

        #connection-panel input {
            width: 100%;
            min-height: 34px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #111;
            color: #eee;
            padding: 7px 8px;
            font-size: 14px;
        }

        #connection-panel .time-input-control {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }

        #connection-panel .time-input-control input {
            width: 3.5em;
            padding: 7px 4px;
        }

        #connection-panel .time-input-period {
            min-height: 34px;
            margin-left: 5px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #111;
            color: #eee;
        }

        #connection-panel button {
            min-height: 34px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #1d1d1d;
            color: #eee;
            padding: 7px 9px;
            font-size: 13px;
            cursor: pointer;
        }

        #connection-panel button:hover,
        #connection-panel button:focus {
            background: #292929;
            outline: none;
        }

        .connection-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .connection-row button {
            flex: 1;
        }

        #connection-status {
            color: #aaa;
            min-height: 18px;
        }

        #local-events-list {
            max-height: 110px;
            overflow: auto;
            margin-top: 8px;
        }

        .local-event-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-top: 1px solid #2c2c2c;
            padding: 6px 0;
        }

        .local-event-item span {
            overflow-wrap: anywhere;
        }

        .local-event-item button {
            min-height: 26px;
            padding: 3px 7px;
            color: #ffb4af;
        }
    </style>
</head>

<body>
    <button id="alarm-bell" type="button" aria-label="{{ translations[language].alarm_set }}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 20h4M12 2v2"/></svg>
    </button>
    <div id="alarm-flash" aria-hidden="true"></div>
    <div id="alarm-message" role="alert"><div id="alarm-name"></div><div id="alarm-prompt"></div></div>
    <div id="clock-container">
        <div id="time-period"></div>
        <div id="time">00:00</div>
        <div id="date-info">
            <span id="date-part">{{ translations[language].loading }}</span>
            <span id="day-part">...</span>
        </div>
    </div>

    <div id="list-container">
        <div id="event-counter"></div>
    </div>

    <button id="connection-toggle" type="button" onclick="toggleConnectionPanel()" data-clock-i18n="connection_settings" data-clock-attribute="aria-label" aria-label="{{ translations[language].connection_settings }}" title="{{ translations[language].connection_settings }}">...</button>
    <div id="connection-panel" aria-live="polite">
        <div id="connection-status"></div>
        <p id="offline-status" role="status" data-ready="{{ translations[language].offline_ready }}" data-unavailable="{{ translations[language].offline_unavailable }}" data-failed="{{ translations[language].offline_failed }}"></p>
        <label for="server-url-input" data-clock-i18n="connection_server_url">{{ translations[language].connection_server_url }}</label>
        <input id="server-url-input" type="url" inputmode="url" placeholder="http://192.168.1.10">
        <div class="connection-row">
            <button type="button" onclick="saveServerUrl()" data-clock-i18n="save">{{ translations[language].save }}</button>
            <button type="button" onclick="reconnectNow()" data-clock-i18n="connection_reconnect">{{ translations[language].connection_reconnect }}</button>
        </div>
        <form id="local-event-form" onsubmit="addLocalEvent(); return false;">
            <label for="local-event-text" data-clock-i18n="local_reminder">{{ translations[language].local_reminder }}</label>
            <input id="local-event-text" type="text" data-clock-i18n="local_reminder_placeholder" data-clock-attribute="placeholder" placeholder="{{ translations[language].local_reminder_placeholder }}">
            <div class="connection-row">
                <input id="local-event-time" type="time" data-clock-i18n="local_reminder_time" data-clock-attribute="aria-label" aria-label="{{ translations[language].local_reminder_time }}">
                <button type="submit" data-clock-i18n="add">{{ translations[language].add }}</button>
            </div>
        </form>
        <div id="local-events-list"></div>
        <p><a id="alarm-manage" href="/schedules">{{ translations[language].alarm_manage }}</a></p>
        <label><input id="alarm-motion" type="checkbox" checked> <span id="alarm-motion-label">{{ translations[language].alarm_flash }}</span></label>
        <p id="alarm-help">{{ translations[language].alarm_sound_hint }}</p>
    </div>

    <script src="{{ url_for('static', filename='clock.js') }}"></script>
    <script>
        window.WebClockCore.start({
            weekDays: {{ translations[language].weekdays | tojson }},
            language: {{ language | tojson }}
        });
    </script>
    <script src="{{ url_for('static', filename='time-format.js') }}"></script>
    <script>
        var I18N = {{ translations | tojson }};
        var currentLanguage = {{ language | tojson }};
        var STORAGE_SERVER_URL = 'webclock.serverUrl';
        var STORAGE_SETTINGS = 'webclock.settings';
        var STORAGE_LOCAL_EVENTS = 'webclock.localEvents';
        var serverUrl = normalizeServerUrl(readStoredValue(STORAGE_SERVER_URL, window.location.origin)) || window.location.origin;
        var connectionMode = 'server';
        var activeSettings = {};
        var lastServerStatus = 'connection_connecting';
        var connectionGeneration = 1;
        var statusRequestSequence = 0;
        var lastHandledStatusSequence = 0;

        function t(key) {
            var pack = I18N[currentLanguage] || I18N['zh-TW'];
            return pack[key] || I18N['zh-TW'][key] || key;
        }

        function setLanguage(language) {
            if (!I18N[language] || currentLanguage === language) return;
            currentLanguage = language;
            document.documentElement.lang = language;
            document.title = t('app_title');
            var labels = document.querySelectorAll('[data-clock-i18n]');
            for (var i = 0; i < labels.length; i++) {
                var label = labels[i];
                var attribute = label.getAttribute('data-clock-attribute');
                var value = t(label.getAttribute('data-clock-i18n'));
                if (attribute) label.setAttribute(attribute, value);
                else label.textContent = value;
            }
            setConnectionStatus(lastServerStatus, connectionMode === 'standalone');
            var offline = document.getElementById('offline-status');
            ['ready', 'unavailable', 'failed'].forEach(function (state) {
                offline.setAttribute('data-' + state, t('offline_' + state));
            });
            var state = offline.getAttribute('data-state');
            if (state) offline.textContent = t('offline_' + state);
            updateClock();
        }

        function readStoredValue(key, fallback) {
            try {
                var value = window.localStorage.getItem(key);
                return value === null ? fallback : value;
            } catch (e) {
                return fallback;
            }
        }

        function writeStoredValue(key, value) {
            try {
                window.localStorage.setItem(key, value);
            } catch (e) {
            }
        }

        function readStoredJson(key, fallback) {
            try {
                var value = window.localStorage.getItem(key);
                return value ? JSON.parse(value) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        function writeStoredJson(key, value) {
            try {
                window.localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (e) {
                return false;
            }
        }

        function normalizeServerUrl(value) {
            if (!value) return "";
            var trimmed = String(value).replace(/\s+/g, "");
            if (!trimmed) return "";
            if (!/^https?:\/\//i.test(trimmed)) {
                trimmed = "http://" + trimmed;
            }
            return trimmed.replace(/\/+$/, "");
        }

        function getStatusUrl(sourceUrl) {
            return sourceUrl + '/api/status?nocache=' + new Date().getTime();
        }

        function defaultDisplaySettings() {
            return {
                mode: 'normal',
                brightness: 100,
                timezone_offset: 8,
                language: currentLanguage,
                time_format: '24h',
                night: {enabled: false, start: '22:00', end: '07:00', brightness: 15, black: false}
            };
        }

        function copyDisplaySettings(settings) {
            return {
                mode: settings.mode,
                brightness: settings.brightness,
                timezone_offset: settings.timezone_offset,
                language: settings.language,
                time_format: settings.time_format,
                night: {
                    enabled: settings.night.enabled,
                    start: settings.night.start,
                    end: settings.night.end,
                    brightness: settings.night.brightness,
                    black: settings.night.black
                }
            };
        }

        function isSettingsObject(value) {
            return value !== null && Object.prototype.toString.call(value) === '[object Object]';
        }

        function owns(object, key) {
            return Object.prototype.hasOwnProperty.call(object, key);
        }

        function normalizedInteger(value, low, high) {
            if (typeof value === 'string') {
                if (!/^-?\d+$/.test(value)) return null;
            } else if (typeof value !== 'number') {
                return null;
            }
            var number = Number(value);
            if (!isFinite(number) || Math.floor(number) !== number || number < low || number > high) return null;
            return number;
        }

        function validClockTime(value) {
            var match = typeof value === 'string' && /^([01]\d|2[0-3]):([0-5]\d)$/.exec(value);
            return !!match;
        }

        function normalizeDisplaySettings(candidate, fallback) {
            if (!isSettingsObject(candidate)) return null;
            var base = fallback && fallback.night ? copyDisplaySettings(fallback) : defaultDisplaySettings();
            var allowed = {
                mode: true, brightness: true, timezone_offset: true,
                language: true, time_format: true, night: true
            };
            var key;
            for (key in candidate) {
                if (owns(candidate, key) && !owns(allowed, key)) return null;
            }

            if (owns(candidate, 'mode')) {
                if (candidate.mode !== 'normal' && candidate.mode !== 'black') return null;
                base.mode = candidate.mode;
            }
            if (owns(candidate, 'brightness')) {
                var brightness = normalizedInteger(candidate.brightness, 0, 100);
                if (brightness === null) return null;
                base.brightness = brightness;
            }
            if (owns(candidate, 'timezone_offset')) {
                var offset = normalizedInteger(candidate.timezone_offset, -12, 14);
                if (offset === null) return null;
                base.timezone_offset = offset;
            }
            if (owns(candidate, 'language')) {
                if (typeof candidate.language !== 'string' || !owns(I18N, candidate.language)) return null;
                base.language = candidate.language;
            }
            if (owns(candidate, 'time_format')) {
                if (candidate.time_format !== '24h' && candidate.time_format !== '12h') return null;
                base.time_format = candidate.time_format;
            }
            if (owns(candidate, 'night')) {
                var night = candidate.night;
                if (!isSettingsObject(night)) return null;
                var nightAllowed = {enabled: true, start: true, end: true, brightness: true, black: true};
                for (key in night) {
                    if (owns(night, key) && !owns(nightAllowed, key)) return null;
                }
                if (owns(night, 'enabled')) {
                    if (typeof night.enabled !== 'boolean') return null;
                    base.night.enabled = night.enabled;
                }
                if (owns(night, 'start')) {
                    if (!validClockTime(night.start)) return null;
                    base.night.start = night.start;
                }
                if (owns(night, 'end')) {
                    if (!validClockTime(night.end)) return null;
                    base.night.end = night.end;
                }
                if (owns(night, 'brightness')) {
                    var nightBrightness = normalizedInteger(night.brightness, 0, 100);
                    if (nightBrightness === null) return null;
                    base.night.brightness = nightBrightness;
                }
                if (owns(night, 'black')) {
                    if (typeof night.black !== 'boolean') return null;
                    base.night.black = night.black;
                }
                if (base.night.start === base.night.end) return null;
            }
            return base;
        }

        function getStoredSettings() {
            var base = defaultDisplaySettings();
            var stored = readStoredJson(STORAGE_SETTINGS, null);
            return normalizeDisplaySettings(stored, base) || base;
        }

        function saveSettings(settings) {
            var normalized = normalizeDisplaySettings(settings,
                activeSettings && activeSettings.night ? activeSettings : defaultDisplaySettings());
            if (!normalized) return false;
            return writeStoredJson(STORAGE_SETTINGS, normalized);
        }

        function applySettings(settings) {
            var normalized = normalizeDisplaySettings(settings,
                activeSettings && activeSettings.night ? activeSettings : defaultDisplaySettings());
            if (!normalized) return false;
            var formatChanged = activeSettings.time_format !== normalized.time_format ||
                normalized.language !== currentLanguage;
            activeSettings = normalized;
            document.body.classList.toggle('uses-12-hour', normalized.time_format === '12h');
            if (normalized.language) {
                setLanguage(normalized.language);
            }
            timezoneOffset = normalized.timezone_offset;

            applyDisplay();
            if (formatChanged) renderLocalEventsEditor();
            refreshLocalTimeInput();
            return true;
        }

        function refreshLocalTimeInput() {
            if (window.WebClockTimeInputs) {
                window.WebClockTimeInputs.refresh(document.getElementById('connection-panel'),
                    activeSettings.time_format, currentLanguage);
            }
        }

        function applyDisplay() {
            var effective = clockDisplaySettings(activeSettings, getClockUtcMs(), timezoneOffset);
            document.body.classList.toggle('force-black', effective.mode === 'black');
            document.getElementById('clock-container').style.opacity = effective.brightness / 100;
            document.getElementById('list-container').style.opacity = effective.brightness / 100;
        }

        var timezoneOffset = 8;
        var clockBaseUtcMs = null;
        var clockBaseDeviceMs = null;

        function setClockBase(utcMs) {
            if (typeof utcMs !== 'number' || !isFinite(utcMs) || utcMs <= 0) return;
            clockBaseUtcMs = utcMs;
            clockBaseDeviceMs = new Date().getTime();
        }

        function getClockUtcMs() {
            var deviceNow = new Date().getTime();
            if (clockBaseUtcMs !== null && clockBaseDeviceMs !== null) {
                return clockBaseUtcMs + (deviceNow - clockBaseDeviceMs);
            }
            return deviceNow;
        }

        function updateClock() {
            renderClock(getClockUtcMs(), timezoneOffset, t('weekdays'), activeSettings.time_format, currentLanguage);
            applyDisplay();
            if (connectionMode === 'standalone') {
                renderList(getLocalEventsForToday());
            }
        }

        function setConnectionStatus(key, isOffline) {
            lastServerStatus = key;
            var message = t(key).replace('{url}', function () { return serverUrl; });
            var status = document.getElementById('connection-status');
            var toggle = document.getElementById('connection-toggle');
            if (status) status.textContent = message;
            if (toggle) {
                toggle.textContent = '...';
                toggle.title = t('connection_settings');
            }
        }

        function enterStandaloneMode(message) {
            connectionMode = 'standalone';
            // Keep the latest live settings, even if saving them failed. The cache
            // is only restored at startup, when no valid in-memory state exists.
            renderList(getLocalEventsForToday());
            updateClock();
            setConnectionStatus(message || 'connection_standalone', true);
        }

        function enterServerMode(data) {
            connectionMode = 'server';
            if (data.settings && applySettings(data.settings)) {
                saveSettings(activeSettings);
            }
            setClockBase(data.server_timestamp);
            var dayPart = document.getElementById('day-part');
            if (data.is_holiday) dayPart.classList.add('holiday-highlight');
            else dayPart.classList.remove('holiday-highlight');

            renderList(data.events);
            updateClock();
            setConnectionStatus('connection_connected', false);
        }

        function beginConnectionGeneration() {
            connectionGeneration += 1;
            lastHandledStatusSequence = 0;
        }

        function finishStatusRequest(request, callback) {
            if (request.finished) return;
            request.finished = true;
            if (request.sourceUrl !== serverUrl || request.generation !== connectionGeneration ||
                    request.sequence <= lastHandledStatusSequence) return;
            // Compare with handled responses, not merely issued polls: a valid
            // response may take longer than the five-second polling interval.
            lastHandledStatusSequence = request.sequence;
            callback();
        }

        function fetchStatus() {
            var xhr = new XMLHttpRequest();
            var request = {
                sourceUrl: serverUrl,
                generation: connectionGeneration,
                sequence: statusRequestSequence += 1,
                finished: false
            };
            xhr.open('GET', getStatusUrl(request.sourceUrl), true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                // Network errors and timeouts first report DONE with status 0.
                // Their terminal event supplies the cause and finishes once.
                if (xhr.status === 0) return;
                finishStatusRequest(request, function () {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            enterServerMode(data);
                        } catch (e) {
                            enterStandaloneMode('connection_unreadable');
                        }
                    } else {
                        enterStandaloneMode('connection_unavailable');
                    }
                });
            };
            xhr.onerror = function () {
                finishStatusRequest(request, function () {
                    enterStandaloneMode('connection_unavailable');
                });
            };
            xhr.ontimeout = function () {
                finishStatusRequest(request, function () {
                    enterStandaloneMode('connection_timeout');
                });
            };
            xhr.timeout = 8000;
            try {
                xhr.send();
            } catch (e) {
                finishStatusRequest(request, function () {
                    enterStandaloneMode('connection_unavailable');
                });
            }
        }

        function getLocalEvents() {
            var events = readStoredJson(STORAGE_LOCAL_EVENTS, []);
            return Array.isArray(events) ? events : [];
        }

        function saveLocalEvents(events) {
            writeStoredJson(STORAGE_LOCAL_EVENTS, events);
            renderLocalEventsEditor();
            if (connectionMode === 'standalone') {
                renderList(getLocalEventsForToday());
            }
        }

        function getLocalEventsForToday() {
            var events = getLocalEvents();
            var today = getClockDateString();
            var visible = [];
            for (var i = 0; i < events.length; i++) {
                var event = events[i];
                if (!event.date || event.date === today) {
                    visible.push({ text: event.text, time: event.time || "" });
                }
            }
            visible.sort(function (a, b) {
                return (a.time || "99:99").localeCompare(b.time || "99:99");
            });
            return visible;
        }

        function getClockDateString() {
            var nowUtcMs = getClockUtcMs();
            var targetTime = new Date(nowUtcMs + (timezoneOffset * 3600000));
            var month = String(targetTime.getUTCMonth() + 1).replace(/^(\d)$/, "0$1");
            var day = String(targetTime.getUTCDate()).replace(/^(\d)$/, "0$1");
            return targetTime.getUTCFullYear() + "-" + month + "-" + day;
        }

        function addLocalEvent() {
            var form = document.getElementById('local-event-form');
            if (form && form.checkValidity && !form.checkValidity()) {
                if (form.reportValidity) form.reportValidity();
                else {
                    var invalid = form.querySelector(':invalid');
                    if (invalid) invalid.focus();
                }
                return;
            }
            var textInput = document.getElementById('local-event-text');
            var timeInput = document.getElementById('local-event-time');
            var text = textInput ? textInput.value.replace(/^\s+|\s+$/g, "") : "";
            if (!text) return;

            var events = getLocalEvents();
            events.push({
                id: new Date().getTime(),
                text: text,
                time: timeInput ? timeInput.value : "",
                date: ""
            });
            if (textInput) textInput.value = "";
            if (timeInput) timeInput.value = "";
            refreshLocalTimeInput();
            saveLocalEvents(events);
        }

        function deleteLocalEvent(id) {
            var events = getLocalEvents().filter(function (event) {
                return String(event.id) !== String(id);
            });
            saveLocalEvents(events);
        }

        function renderLocalEventsEditor() {
            var list = document.getElementById('local-events-list');
            if (!list) return;
            var events = getLocalEvents();
            list.innerHTML = "";
            for (var i = 0; i < events.length; i++) {
                var event = events[i];
                var item = document.createElement('div');
                var text = document.createElement('span');
                var button = document.createElement('button');
                item.className = 'local-event-item';
                text.textContent = (event.time ? window.WebClockTime.format(event.time, activeSettings.time_format, currentLanguage) + " " : "") + event.text;
                button.type = 'button';
                button.textContent = t('delete');
                button.setAttribute('data-event-id', event.id);
                button.onclick = function () {
                    deleteLocalEvent(this.getAttribute('data-event-id'));
                };
                item.appendChild(text);
                item.appendChild(button);
                list.appendChild(item);
            }
        }

        function toggleConnectionPanel() {
            var panel = document.getElementById('connection-panel');
            var input = document.getElementById('server-url-input');
            if (!panel) return;
            panel.classList.toggle('open');
            if (input) input.value = serverUrl;
            setConnectionStatus(lastServerStatus, connectionMode === 'standalone');
            renderLocalEventsEditor();
        }

        function saveServerUrl() {
            var input = document.getElementById('server-url-input');
            var nextUrl = input ? normalizeServerUrl(input.value) : "";
            if (!nextUrl) return false;
            var changed = nextUrl !== serverUrl;
            serverUrl = nextUrl;
            if (changed) beginConnectionGeneration();
            writeStoredValue(STORAGE_SERVER_URL, serverUrl);
            setConnectionStatus('connection_saved', connectionMode === 'standalone');
            return changed;
        }

        function reconnectNow() {
            if (!saveServerUrl()) beginConnectionGeneration();
            setConnectionStatus('connection_connecting', connectionMode === 'standalone');
            fetchStatus();
        }

        var currentEventsJson = "";
        var currentIndex = 0;
        var carouselInterval = null;

        function renderList(events) {
            document.body.classList.toggle('has-events', !!(events && events.length));
            var newJson = JSON.stringify([events, activeSettings.time_format, currentLanguage]);
            if (newJson === currentEventsJson) return;
            currentEventsJson = newJson;

            var container = document.getElementById('list-container');
            var oldRows = container.querySelectorAll('.event-row');
            for (var k = 0; k < oldRows.length; k++) {
                container.removeChild(oldRows[k]);
            }

            var counterDiv = document.getElementById('event-counter');
            if (!events || events.length === 0) {
                container.style.display = 'none';
                counterDiv.textContent = "";
                return;
            }

            container.style.display = 'block';
            currentIndex = 0;
            counterDiv.textContent = "1 / " + events.length;

            for (var i = 0; i < events.length; i++) {
                var item = events[i];
                var div = document.createElement('div');
                var contentSpan = document.createElement('span');

                div.className = 'event-row';
                if (i === 0) div.classList.add('active');
                contentSpan.className = 'event-content-wrapper';

                if (item.time) {
                    var timeSpan = document.createElement('span');
                    timeSpan.className = 'event-time';
                    timeSpan.textContent = window.WebClockTime.format(item.time, activeSettings.time_format, currentLanguage);
                    contentSpan.appendChild(timeSpan);
                }

                var textSpan = document.createElement('span');
                textSpan.textContent = item.text || '';
                contentSpan.appendChild(textSpan);
                div.appendChild(contentSpan);
                container.appendChild(div);
            }

            applyScrolling(document.querySelector('.event-row.active'));
            if (!carouselInterval) {
                carouselInterval = setInterval(showNextEvent, 5000);
            }
        }

        function applyScrolling(row) {
            if (!row) return;
            var wrapper = row.querySelector('.event-content-wrapper');
            if (!wrapper) return;
            if (wrapper.offsetWidth > row.offsetWidth) {
                wrapper.classList.add('scrolling');
            } else {
                wrapper.classList.remove('scrolling');
            }
        }

        function showNextEvent() {
            var items = document.querySelectorAll('.event-row');
            if (items.length === 0) return;
            if (items[currentIndex]) {
                items[currentIndex].classList.remove('active');
            }

            currentIndex = (currentIndex + 1) % items.length;
            var nextItem = items[currentIndex];
            nextItem.classList.add('active');

            var counterDiv = document.getElementById('event-counter');
            if (counterDiv) {
                counterDiv.textContent = (currentIndex + 1) + " / " + items.length;
            }
            applyScrolling(nextItem);
        }

        // Upgrade the already-running basic clock without creating another timer.
        window.WebClockCore.useUpdater(updateClock);
        applySettings(getStoredSettings());
        renderLocalEventsEditor();
        setConnectionStatus('connection_connecting', false);
        setInterval(fetchStatus, 5000);
        fetchStatus();
    </script>
    <script src="{{ url_for('static', filename='time-inputs.js') }}"></script>
    <script>refreshLocalTimeInput();</script>
    <script src="{{ url_for('static', filename='offline.js') }}"></script>
    <script defer src="{{ url_for('static', filename='alarm-audio.js') }}"></script>
    <script defer src="{{ url_for('static', filename='alarms.js') }}"></script>
</body>
