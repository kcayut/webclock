substitutions:
  core_src: "../core"
  view_src: "../views"
  board_id: seeed_xiao_esp32s3
  piezo_pin: GPIO8
  min_cpu: "80"
packages:
  platform: !include ../core/esp32s3.yaml
  audio: !include piezo.yaml
  desk: !include ../core/desk.yaml
  face: !include ../views/classic.yaml

esphome:
  name: ee04-clock
i2c:
  sda: GPIO41
  scl: GPIO42
  frequency: 50kHz
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
switch:
  - platform: gpio
    id: panel_power
    pin: GPIO43
    restore_mode: ALWAYS_ON
    internal: true
binary_sensor:
  - id: !extend select_key
    pin: {number: GPIO2, mode: INPUT_PULLUP, inverted: true}
  - id: !extend ok_key
    pin: {number: GPIO3, mode: INPUT_PULLUP, inverted: true}
  - id: !extend cancel_key
    pin: {number: GPIO5, mode: INPUT_PULLUP, inverted: true}
font:
  - {file: "${label_file}", id: label_small, size: 28, glyphs: "${label_glyphs}"}

display:
  - platform: epaper_spi
    id: panel
    model: Seeed-ee04-mono-4.26
    full_update_every: 30
    update_interval: never
    lambda: !include ../views/classic-frame.yaml
