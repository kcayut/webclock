|-
  it.fill(Color::WHITE);
  const auto now = id(wall).now();
  const auto field = deskclock::editor.field;
  const bool sounding = id(ringing) || id(service_clock).is_ringing();
  const bool edit = !sounding && field != deskclock::Editor::Clock;
  const int alarm = edit ? deskclock::editor.draft : id(daily_alarm).value;
  const int hh = alarm % 1440 / 60, mm = alarm % 60;
  const auto ink = Color::BLACK;
  auto button = [&](int x, int y, int w, const char *text, bool selected) {
    if (selected) {
      it.filled_rectangle(x, y, w, 40, ink);
      deskclock::draw_line(it, *id(ticker_atlas), text, 0, y + 4, Color::WHITE,
                           x + (w - deskclock::line_width(text)) / 2);
    } else {
      it.rectangle(x, y, w, 40, ink);
      deskclock::draw_line(it, *id(ticker_atlas), text, 0, y + 4, ink,
                           x + (w - deskclock::line_width(text)) / 2);
    }
  };
  if (deskusb::active() && !sounding) {
    deskclock::draw_line(it, *id(ticker_atlas), "USB 配對", 0, 95, ink);
    deskclock::draw_line(it, *id(ticker_atlas), "電腦執行配對工具", 0, 190, ink);
    deskclock::draw_line(it, *id(ticker_atlas), "按 × 返回選單", 0, 335, ink);
    return;
  }
  if (!sounding && deskclock::manual.field != deskclock::ManualClock::Idle) {
    const auto &c = deskclock::manual;
    const char *names[] = {"", "年份", "月份", "日期", "小時", "分鐘十位", "分鐘個位"};
    deskclock::draw_line(it, *id(ticker_atlas), std::string("設定時間 / ") + names[c.field], 0, 60, ink);
    it.printf(400, 110, id(label), ink, TextAlign::CENTER, "%04d / %02d / %02d", c.year,c.month,c.day);
    it.printf(400, 265, id(digits), ink, TextAlign::CENTER, "%02d:%02d", c.hour,c.minute);
    it.print(400, 444, id(label), ink, TextAlign::CENTER, "＋ 選擇   ● 確定   × 取消");
    return;
  }
  if (!sounding && !edit && deskclock::menu.active()) {
    deskclock::draw_line(it, *id(ticker_atlas), "選單", 0, 45, ink,
                         (800 - deskclock::line_width("選單")) / 2);
    it.line(130, 100, 670, 100, ink);
    const char *items[] = {"設定時間", "每日鬧鐘", "USB 配對"};
    for (int i = 0; i < 3; ++i) {
      const int y = 150 + i * 80;
      if (i == int(deskclock::menu.item))
        deskclock::draw_line(it, *id(ticker_atlas), ">", 0, y, ink, 300);
      deskclock::draw_line(it, *id(ticker_atlas), items[i], 0, y, ink, 340);
    }
    const std::string hint = "＋ 選擇   ● 確定   × 返回";
    deskclock::draw_line(it, *id(ticker_atlas), hint, 0, 430, ink,
                         (800 - deskclock::line_width(hint)) / 2);
    return;
  }
  const auto &editor = deskclock::editor;
  if (edit && field == deskclock::Editor::Enabled && editor.original >= 1440) {
    it.printf(400, 65, id(label), ink, TextAlign::CENTER, "鬧鐘  %02d:%02d", hh, mm);
    button(120, 145, 560, "設定鬧鐘時間", editor.action == deskclock::Editor::EditTime);
    if (editor.target) {
      auto when = ESPTime::from_epoch_local(int64_t(editor.target) * 60);
      const auto text = std::string(editor.target == editor.original_skip ? "恢復響鈴 " : "跳過下一次 ") +
                        when.strftime("%m/%d %H:%M");
      button(120, 220, 560, text.c_str(), editor.action == deskclock::Editor::Skip || editor.action == deskclock::Editor::Resume);
    } else {
      deskclock::draw_line(it, *id(ticker_atlas), now.is_valid() ? "本次已跳過" : "等待校時", 0, 224, ink, 260);
    }
    button(120, 295, 560, "取消鬧鈴", editor.action == deskclock::Editor::Disable);
    it.print(400, 444, id(label), ink, TextAlign::CENTER, "＋ 選擇   ● 確定   × 取消");
    return;
  }
  if (edit) {
    const char *fields[] = {"", "鬧鐘開關", "小時", "分鐘十位", "分鐘個位"};
    it.print(400, 42, id(label), ink, TextAlign::CENTER, fields[field]);
  } else if (now.is_valid()) {
    it.strftime(400, 42, id(label), ink, TextAlign::CENTER, "%Y / %m / %d", now);
  } else {
    it.print(400, 42, id(label), ink, TextAlign::CENTER, "等待校時");
  }
  if (edit || now.is_valid())
    it.printf(400, 212, id(digits), ink, TextAlign::CENTER, "%02d:%02d",
              edit ? hh : int(now.hour), edit ? mm : int(now.minute));
  else it.print(400, 212, id(digits), ink, TextAlign::CENTER, "--:--");
  it.line(130, 335, 670, 335, ink);
  if (sounding) {
    deskclock::draw_line(it, *id(ticker_atlas), "鬧鐘響鈴", 0, 360, ink);
    if (!deskclock::ring_cancel.open) {
      button(300, 355, 200, "取消響鈴", true);
    } else {
      button(270, 355, 120, "取消", deskclock::ring_cancel.choice == deskclock::RingCancel::Cancel);
      button(410, 355, 120, "確認", deskclock::ring_cancel.choice == deskclock::RingCancel::Confirm);
    }
  } else if (!edit && id(daily_alarm).base == -2) {
    deskclock::draw_line(it, *id(ticker_atlas), "遠端已刪除或變更規則 / 本機已停用", 0, 360, ink);
  } else if (!edit && alarm >= 1440 && now.is_valid() && id(daily_alarm).skip >= now.timestamp / 60) {
    auto when = ESPTime::from_epoch_local(int64_t(id(daily_alarm).skip) * 60);
    const auto text = std::string("已跳過 ") + when.strftime("%m/%d %H:%M");
    deskclock::draw_line(it, *id(ticker_atlas), text, 0, 355, ink, (800 - deskclock::line_width(text)) / 2);
  } else {
    it.printf(400, 372, id(label), ink, TextAlign::CENTER, "鬧鐘%s  %02d:%02d",
              alarm >= 1440 ? "已啟用" : "已停用", hh, mm);
  }
  if (sounding) {
    if (!id(service_clock).ticker().empty())
      deskclock::draw_line(it, *id(ticker_atlas), id(service_clock).ticker(), deskclock::ticker.start, 430, ink);
    return;
  }
  if (edit) it.print(400, 444, id(label), ink, TextAlign::CENTER, "＋ 選擇   ● 確定   × 取消");
  else if (id(service_clock).ticker().empty()) {
    const std::string hint = "● 進入選單";
    deskclock::draw_line(it, *id(ticker_atlas), hint, 0, 430, ink,
                         (800 - deskclock::line_width(hint)) / 2);
  } else deskclock::draw_line(it, *id(ticker_atlas), id(service_clock).ticker(), deskclock::ticker.start, 430, ink);
