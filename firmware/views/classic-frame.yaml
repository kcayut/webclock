|-
  const auto ink = ${face_ink};
  const auto paper = ${face_paper};
  it.fill(paper);
  // Layout uses 800 x 480 design coordinates; fonts and bitmap cells match the panel width.
  const int width = it.get_width(), height = it.get_height();
  auto x = [width](int n) { return n * width / 800; };
  auto y = [height](int n) { return n * height / 480; };
  const int cell_scale = width / 400;
  const auto now = id(wall).now();
  const auto &prefs = id(display_options);
  const auto lang = id(ui_language);
  using deskclock::Text;
  const auto tr = [&](Text key) { return deskclock::translate(lang, key); };
  const auto &ticker = id(service_clock).ticker(prefs.reminders, prefs.calendar);
  const auto field = deskclock::editor.field;
  const bool sounding = id(ringing) || id(service_clock).is_ringing();
  const bool edit = !sounding && field != deskclock::Editor::Clock;
  const int alarm = edit ? deskclock::editor.draft : id(daily_alarm).value;
  const int hh = alarm % 1440 / 60, mm = alarm % 60;
  auto hint = [&](Text key) {
    it.print(x(400), y(444), id(label), ink, TextAlign::CENTER, tr(key));
  };
  auto button = [&](int left, int top, int w, const char *text, bool selected) {
    if (selected) it.filled_rectangle(x(left), y(top), x(w), y(48), ink);
    else it.rectangle(x(left), y(top), x(w), y(48), ink);
    it.print(x(left + w / 2), y(top + 24), id(label_small), selected ? paper : ink, TextAlign::CENTER, text);
  };
  if (deskusb::active() && !sounding) {
    it.print(x(400), y(95), id(label), ink, TextAlign::CENTER, tr(Text::UsbPair));
    it.print(x(400), y(190), id(label_small), ink, TextAlign::CENTER, tr(Text::UsbConnect));
    it.print(x(400), y(245), id(label_small), ink, TextAlign::CENTER, tr(Text::UsbRun));
    hint(Text::BackMenu);
    return;
  }
  if (!sounding && deskclock::manual.field != deskclock::ManualClock::Idle) {
    const auto &c = deskclock::manual;
    const Text fields[] = {Text::Year, Text::Month, Text::Day, Text::Hour, Text::MinuteTens, Text::MinuteOnes};
    it.printf(x(400), y(42), id(label_small), ink, TextAlign::CENTER, "%s / %s",
              tr(Text::SetTime), tr(fields[c.field - 1]));
    it.printf(x(400), y(110), id(label), ink, TextAlign::CENTER, "%04d / %02d / %02d", c.year, c.month, c.day);
    it.printf(x(400), y(265), id(digits), ink, TextAlign::CENTER, "%02d:%02d", c.hour, c.minute);
    hint(Text::AdjustKeys);
    return;
  }
  if (!sounding && !edit && deskclock::menu.active()) {
    const auto &menu = deskclock::menu;
    constexpr int rows_per_page = 4;
    const int page = menu.selected() / rows_per_page;
    const int count = menu.row_count();
    if (menu.preferences())
      it.printf(x(400), y(60), id(label), ink, TextAlign::CENTER, "%s %d/%d",
                tr(Text::Display), page + 1, (count + rows_per_page - 1) / rows_per_page);
    else it.print(x(400), y(60), id(label), ink, TextAlign::CENTER, tr(Text::Menu));
    it.line(x(130), y(100), x(670), y(100), ink);
    for (int slot = 0, i = page * rows_per_page; slot < rows_per_page && i < count; ++slot, ++i) {
      const int row = 146 + slot * 65;
      if (i == menu.selected())
        it.print(x(205), y(row), id(label), ink, TextAlign::CENTER_LEFT, ">");
      it.print(x(245), y(row), id(label), ink, TextAlign::CENTER_LEFT, menu.row_label(i, prefs, lang).c_str());
    }
    hint(menu.preferences() ? Text::ChangeKeys : Text::ChooseKeys);
    return;
  }
  const auto &editor = deskclock::editor;
  if (edit && field == deskclock::Editor::Enabled && editor.original >= 1440) {
    it.printf(x(400), y(65), id(label), ink, TextAlign::CENTER, "%s  %02d:%02d", tr(Text::Alarm), hh, mm);
    button(120, 145, 560, tr(Text::SetAlarmTime), editor.action == deskclock::Editor::EditTime);
    if (editor.target) {
      auto when = ESPTime::from_epoch_local(int64_t(editor.target) * 60);
      const auto text = std::string(tr(editor.target == editor.original_skip ? Text::Resume : Text::SkipNext)) +
                        "  " + when.strftime("%m/%d %H:%M");
      button(120, 220, 560, text.c_str(), editor.action == deskclock::Editor::Skip || editor.action == deskclock::Editor::Resume);
    } else {
      it.print(x(400), y(244), id(label_small), ink, TextAlign::CENTER, tr(now.is_valid() ? Text::SkippedThis : Text::Waiting));
    }
    button(120, 295, 560, tr(Text::DisableAlarm), editor.action == deskclock::Editor::Disable);
    hint(Text::ChooseKeys);
    return;
  }
  if (edit) {
    const Text fields[] = {Text::AlarmSwitch, Text::Hour, Text::MinuteTens, Text::MinuteOnes};
    it.print(x(400), y(42), id(label), ink, TextAlign::CENTER, tr(fields[field - 1]));
  } else if (sounding || prefs.date_style != deskclock::DisplayPrefs::HideDate) {
    if (now.is_valid()) it.strftime(x(400), y(42), id(label), ink, TextAlign::CENTER,
                                    sounding ? "%Y / %m / %d" : prefs.date_pattern(), now);
    else it.print(x(400), y(42), id(label), ink, TextAlign::CENTER, tr(Text::Waiting));
  }
  if (sounding)
    it.print(x(400), y(93), id(label_small), ink, TextAlign::CENTER,
             tr(deskclock::ring_cancel.open ? Text::StopQuestion : Text::AlarmRinging));
  const float volts = ${battery_voltage};
  if (!edit && !sounding && prefs.battery && std::isfinite(volts) && volts > 0.5f)
    it.printf(x(780), y(24), id(label_small), ink, TextAlign::TOP_RIGHT, "%.2f V", volts);
  if (edit || sounding || prefs.time_style != deskclock::DisplayPrefs::HideTime) {
    if (!edit && !sounding && now.is_valid() && prefs.time_style == deskclock::DisplayPrefs::H12)
      it.print(x(400), y(90), id(label), ink, TextAlign::CENTER, tr(now.hour < 12 ? Text::Am : Text::Pm));
    const int hour = sounding ? now.hour : prefs.hour(now.hour);
    if (edit || now.is_valid())
      it.printf(x(400), y(212), id(digits), ink, TextAlign::CENTER, "%02d:%02d",
                edit ? hh : hour, edit ? mm : int(now.minute));
    else it.print(x(400), y(212), id(digits), ink, TextAlign::CENTER, "--:--");
  }
  if (edit || sounding || prefs.alarms) it.line(x(130), y(335), x(670), y(335), ink);
  if (sounding) {
    if (!deskclock::ring_cancel.open) {
      button(270, 355, 260, tr(Text::StopRing), true);
    } else {
      button(90, 355, 300, tr(Text::KeepRinging), deskclock::ring_cancel.choice == deskclock::RingCancel::Cancel);
      button(410, 355, 300, tr(Text::ConfirmStop), deskclock::ring_cancel.choice == deskclock::RingCancel::Confirm);
    }
  } else if (edit || prefs.alarms) {
    if (!edit && id(daily_alarm).base == -2) {
      it.printf(x(400), y(372), id(label_small), ink, TextAlign::CENTER, "%s / %s",
                tr(Text::RemoteChanged), tr(Text::AlarmOff));
    } else if (!edit && alarm >= 1440 && now.is_valid() && id(daily_alarm).skip >= now.timestamp / 60) {
      auto when = ESPTime::from_epoch_local(int64_t(id(daily_alarm).skip) * 60);
      it.printf(x(400), y(372), id(label_small), ink, TextAlign::CENTER, "%s  %s",
                tr(Text::Skipped), when.strftime("%m/%d %H:%M").c_str());
    } else {
      it.printf(x(400), y(372), id(label), ink, TextAlign::CENTER, "%s  %02d:%02d",
                tr(alarm >= 1440 ? Text::AlarmOn : Text::AlarmOff), hh, mm);
    }
  }
  if (edit) hint(Text::AdjustKeys);
  else if (!ticker.empty())
    deskclock::draw_line(it, *id(ticker_atlas), ticker, deskclock::ticker.start, y(430), ink, x(22), cell_scale);
  else if (!sounding) hint(Text::OpenMenu);
