substitutions:
  digit_size: "280"
  label_size: "38"
  label_file: "${view_src}/fonts/NotoSansTC-clock.ttf"
  label_glyphs: ' %()-./0123456789:>?ABCDEHKLMOPRSTUVWYabcdefghijklmnoprstuvwxy°×●かくけしすせちでにのはまみめらるわをアイオカキグケコサスソダッツニバパフブプペマムメュラリルレン・ー一上下中事今付份位個停入具分切刪刻則削前効動十午取合啟單回圧在執壓変字定実對小工已年度待後復恢態或戻択接提換擇整文料日時曆更替月有期本校次止毎每池決消済温湿溫濕無状狀用確示端等続線繁繼續腦藏行表規解言設認語調變資跳返這連進過遠選配醒鈴鐘開間關除隱電非響顯體鬧鳴（）＋／？'
  face_ink: "Color::BLACK"
  face_paper: "Color::WHITE"
  battery_voltage: "NAN"

esphome:
  includes:
    - ${view_src}/ticker.h
image:
  - {platform: file, file: "${view_src}/fonts/ticker.png", id: ticker_atlas, type: BINARY}

font:
  - {file: "${view_src}/fonts/Barlow-Bold.ttf", id: digits, size: "${digit_size}", glyphs: '0123456789:-'}
  - {file: "${label_file}", id: label, size: "${label_size}", glyphs: "${label_glyphs}"}

interval:
  - interval: 250ms
    then:
      - lambda: |-
          const auto now = id(wall).now();
          const int minute = now.is_valid() ? now.hour * 60 + now.minute : -1;
          const auto &prefs = id(display_options);
          const auto &text = id(service_clock).ticker(prefs.reminders, prefs.calendar);
          static std::string previous_text;
          static int previous_minute = -2;
          if (previous_text != text) {
            previous_text = text;
            deskclock::ticker.reset(millis());
          }
          const bool home = !deskusb::active() && !deskclock::menu.active() &&
                            deskclock::editor.field == deskclock::Editor::Clock &&
                            deskclock::manual.field == deskclock::ManualClock::Idle;
          const bool edit = deskclock::editor.field != deskclock::Editor::Clock;
          const bool sounding = id(ringing) || id(service_clock).is_ringing();
          const bool tick = (home || sounding) && deskclock::ticker.advance(text, millis());
          if (id(dirty) || ((home || edit || sounding) && minute != previous_minute) || tick) {
            id(dirty) = false;
            previous_minute = minute;
            id(panel).update();
          }
