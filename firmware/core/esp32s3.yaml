wifi:
  id: desk_wifi
  on_connect:
    # After joining once, a router outage should not power a setup AP until reboot.
    - lambda: id(desk_wifi).set_ap_timeout(0);
  ap:
    ssid: WebClock-Setup
    password: !env_var WEBCLOCK_DESK_AP_PASSWORD
    ap_timeout: 60s
captive_portal:
provisioning:
  timeout: 10min
esp32:
  board: ${board_id}
  flash_size: 16MB
  cpu_frequency: 240MHz
  partitions: ../core/partitions.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: "y"
      CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION: "y"
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN: "n"
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false
logger:
  hardware_uart: USB_SERIAL_JTAG
