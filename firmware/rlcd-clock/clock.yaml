substitutions:
  core_src: "../core"
  view_src: "../views"
  board_id: esp32-s3-devkitc-1
  min_cpu: "80"
  digit_size: "140"
  label_size: "20"
  label_file: "NotoSansTC-rlcd.ttf"
packages:
  platform: !include ../core/esp32s3.yaml
  desk: !include ../core/desk.yaml
  face: !include ../views/classic.yaml
  audio: !include audio.yaml

esphome:
  name: rlcd-clock
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            deskclock::menu.environment = &id(show_environment);

globals:
  - id: show_environment
    type: bool
    restore_value: yes
    initial_value: 'true'

external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD@5a3e9456c94e2eb85280c24e6c2e18b1f7e03406
    components: [st7305_rlcd]
    refresh: never

i2c:
  sda: GPIO13
  scl: GPIO14
  frequency: 100kHz
spi:
  interface: spi2
  clk_pin: GPIO11
  mosi_pin: GPIO12
binary_sensor:
  - id: !extend select_key
    pin: {number: GPIO1, mode: INPUT_PULLUP, inverted: true}
  - id: !extend ok_key
    pin: {number: GPIO2, mode: INPUT_PULLUP, inverted: true}
  - id: !extend cancel_key
    pin: {number: GPIO17, mode: INPUT_PULLUP, inverted: true}
sensor:
  - platform: shtcx
    address: 0x70
    update_interval: 60s
    temperature:
      id: air_temperature
      on_value:
        - lambda: if (id(show_environment)) id(dirty) = true;
    humidity:
      id: air_humidity
      on_value:
        - lambda: if (id(show_environment)) id(dirty) = true;
  - platform: adc
    pin: GPIO4
    id: cell_voltage
    attenuation: 12db
    samples: 8
    update_interval: 60s
    filters: [{multiply: 3.0}]
    on_value:
      - lambda: id(dirty) = true;
display:
  - platform: st7305_rlcd
    id: panel
    model: WAVESHARE_400X300
    cs_pin: GPIO40
    dc_pin: GPIO5
    reset_pin: GPIO41
    rotation: 0°
    data_rate: 1MHz
    update_interval: never
    lambda: !include screen.yaml
