version: '3.8'

services:
  webclock:
    build: .
    container_name: webclock
    restart: always
    ports:
      - "80:5000"
    volumes:
      - ./manual_notes.json:/app/manual_notes.json:ro
      # Persist the whole private state directory, including auth.json,
      # auth-required and device-access.json. Match this mount if STATE_DIR changes.
      - ./webclock_state:/app/webclock_state
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NOTES_FILE=/app/webclock_state/manual_notes.json
    env_file:
      - .env
